<p-toast position="top-center"></p-toast>
<div class="layout-topbar">
  <a class="layout-topbar-logo" routerLink="">
    <img src="assets/layout/images/AMCfarbigKlein.gif" alt="logo" />
    <span id="header">Auto-Moto-Club Swissair</span>
  </a>

  <button
    #menubutton
    class="p-link layout-menu-button layout-topbar-button"
    (click)="layoutService.onMenuToggle()"
    p-button
    type="icon"
  >
    <i class="pi pi-bars"></i>
  </button>
  <button pButton [outlined]="true" (click)="toggleDarkMode()"><i [class]="iconMode()"></i></button>
</div>
