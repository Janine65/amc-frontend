<div class="card">
  <p-toast key="local"></p-toast>
  <button pButton pRipple type="button" (click)="onAdd()" severity="secondary" [outlined]="true" class="mb-2"><i class="pi pi-plus"></i> Neuen Bericht hinzufügen</button>
  @if (!loading()) {
    <p-table [value]="berichte()" dataKey="id" showGridlines>
      <ng-template #header>
        <tr>
          <th style="width: 12%">Datum</th>
          <th style="width: 22%">Titel</th>
          <th style="width: 36%">Text</th>
          <th style="width: 12%">Datei</th>
          <th style="width: 8%">Publiziert</th>
          <th style="width: 10%"></th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td>{{ item.datum | date: 'dd.MM.yyyy' }}</td>
          <td>{{ item.titel }}</td>
          <td>{{ textPreview(item) }}</td>
          <td>{{ item.datei }}</td>
          <td>
            @if (item.publiziert) {
              <i class="pi pi-check" style="color: green"></i>
            } @else {
              <i class="pi pi-times" style="color: red"></i>
            }
          </td>
          <td>
            <div class="flex items-center justify-center gap-2">
              <button pButton pRipple type="button" (click)="onEdit(item)" [rounded]="true" [text]="true"><i class="pi pi-pencil"></i></button>
              <button pButton pRipple type="button" (click)="onDelete(item)" [rounded]="true" [text]="true"><i class="pi pi-trash"></i></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="6">Keine Berichte vorhanden.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
