<div class="card">
  <p-toast key="local"></p-toast>
  <p-confirmdialog></p-confirmdialog>
  @if (!loading()) {
    <p-table [value]="kontakte()" dataKey="id" showGridlines>
      <ng-template #header>
        <tr>
          <th style="width: 3%"></th>
          <th style="width: 15%">Name</th>
          <th style="width: 15%">Vorname</th>
          <th style="width: 22%">E-Mail</th>
          <th style="width: 30%">Betreff</th>
          <th style="width: 13%">Eingegangen</th>
          <th style="width: 2%"></th>
        </tr>
      </ng-template>
      <ng-template #body let-item let-expanded="expanded">
        <tr>
          <td>
            <button pButton pRipple type="button" [pRowToggler]="item" [rounded]="true" [text]="true">
              <i [class]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
            </button>
          </td>
          <td>{{ item.name }}</td>
          <td>{{ item.vorname }}</td>
          <td><a href="mailto:{{ item.email }}">{{ item.email }}</a></td>
          <td>{{ item.betreff }}</td>
          <td>{{ item.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
          <td>
            <button pButton pRipple type="button" (click)="onDelete(item)" [rounded]="true" [text]="true"><i class="pi pi-trash"></i></button>
          </td>
        </tr>
      </ng-template>
      <ng-template #expandedrow let-item>
        <tr>
          <td colspan="7">
            <div class="p-3" style="white-space: pre-wrap">{{ item.nachricht }}</div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="7">Keine Kontaktanfragen vorhanden.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
