<h2>
  Auswertung für
  <p-select
    id="jahr"
    [options]="selJahre()"
    optionLabel="label"
    optionValue="value"
    [(ngModel)]="selJahr"
    class="mr-2 mb-1"
    (onChange)="updateGraph()"
  ></p-select>
</h2>
<div class="card" style="height: 80%; overflow-y: auto">
  <canvas
    baseChart
    type="bar"
    [data]="data() ?? { labels: [], datasets: [] }"
    [options]="options() ?? {}"
  ></canvas>
</div>
