<div class="surface-card p-4 shadow border-round w-full lg:w-1/3">
  <form
    [formGroup]="fg"
    autocomplete="off"
    (ngSubmit)="onSubmit()"
    class="cr-form"
  >
    <div class="text-center mb-5">
      <img
        src="assets/favicon.gif"
        alt="Auto-Moto-Club Swissair"
        height="50"
        class="mb-3"
      />
      <div class="text-900 text-3xl font-medium mb-3">Willkommen zurück</div>
    </div>
    <div>
      <cr-input placeholder="Email">
        <input
          crinput
          crpattern="email"
          id="email"
          type="email"
          [required]="true"
          formControlName="email"
          pInputText
          autocomplete="email"
          class="w-full mb-3"
        />
      </cr-input>
      <cr-input placeholder="Passwort">
        <input
          crinput
          crpattern="password"
          pPassword
          toggleMask="true"
          id="password"
          type="password"
          formControlName="password"
          required
          autocomplete="password"
          class="mb-3"
          [style]="{ width: '100%' }"
        />
      </cr-input>
    </div>
    <div class="mt-3">
      <p-button
        pRipple
        type="submit"
        label="Login"
        [disabled]="loading()"
        severity="primary"
        [outlined]="true"
        styleClass="p-2 mr-4"
      ></p-button>
      <p-button
        pRipple
        label="Neues Passwot senden"
        [disabled]="loading()"
        severity="secondary"
        [outlined]="true"
        styleClass="p-2"
        (click)="onReset()"
      ></p-button>
    </div>
  </form>
</div>
