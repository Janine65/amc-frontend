<div class="flex justify-end mt-3">
  <button pButton severity="secondary" (click)="ref.close()"><i class="pi pi-times"></i> Schliessen</button>
</div>
@if (pdfFile()) {
  <div>
    <object
      [data]="pdfFile()"
      type="application/pdf"
      width="100%"
      height="600px"
    >
      <p>
        Your browser does not support PDFs.
        <a [href]="pdfFile()">Download the PDF</a>.
      </p>
    </object>
  </div>
}
