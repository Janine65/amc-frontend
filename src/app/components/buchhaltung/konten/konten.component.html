<p-splitter [panelSizes]="[60, 40]" styleClass="mb-1">
  <ng-template #panel>
    <div class="card" style="width: 100%">
      <app-basetable
        [tableOptions]="cols()"
        [tableData]="lstAccount()"
        [formatFunction]="formatField"
        [tableToolbar]="toolbar()"
        localStorage="account"
      >
      </app-basetable>
    </div>
  </ng-template>
  <ng-template #panel>
    <div class="card" style="width: 100%">
      <form autocomplete="off" (ngSubmit)="save()">
        <div class="flex flex-wrap">
          <div class="mb-4 w-full md:w-full mt-4">
            <label for="name" class="mr-2">Name</label>
            <input
              type="text"
              name="name"
              pInputText
              minlength="4"
              required
              class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
              [(ngModel)]="selAccount.name"
              [disabled]="!editMode() && !addMode()"
            />
          </div>
          <div class="mb-4 w-full md:w-full mt-4">
            <label for="level" class="mr-2">Level</label>
            <input
              type="text"
              name="level"
              pInputText
              minlength="5"
              required
              class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
              [(ngModel)]="selAccount.level"
              [disabled]="!editMode() && !addMode()"
            />
          </div>
          <div class="mb-4 w-full md:w-full mt-4">
            <label for="order" class="mr-2">Order</label>
            <input
              type="text"
              name="order"
              pInputText
              minlength="5"
              required
              class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
              [(ngModel)]="selAccount.order"
              [disabled]="!editMode() && !addMode()"
            />
          </div>
          <div class="mb-4 w-full md:w-full mt-4">
            <label for="status" class="mr-2">Status</label>
            <p-select
              name="state"
              [options]="lstStates()"
              optionLabel="label"
              optionValue="value"
              [disabled]="!editMode() && !addMode()"
              class="mr-2 text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
              [(ngModel)]="selAccount.status"
              [style]="{ width: '80%' }"
            ></p-select>
          </div>
          <div class="mb-4 w-full md:w-full mt-4">
            <p-button
              type="button"
              label="Sichern"
              icon="pi pi-save"
              severity="primary"
              [outlined]="true"
              (click)="save()"
              [disabled]="!editMode() && !addMode()"
            ></p-button>
          </div>
        </div>
      </form>
    </div> </ng-template
></p-splitter>
