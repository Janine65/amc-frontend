<div class="card" style="width: 100%">
  <app-basetable
    [tableOptions]="cols()"
    [tableData]="lstReceipts()"
    [tableToolbar]="toolbar()"
    localStorage="receipt"
    [editable]="false"
    [diffCalcHight]="350"
  >
  </app-basetable>
</div>
<p-confirm-dialog
  header="Confirmation"
  icon="pi pi-exclamation-triangle"
></p-confirm-dialog>
<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }">
  <ng-template #header>
    <span class="text-xl font-bold"
      >Attachmenet {{ selAtt.receipt }}: Bezeichnung ändern</span
    >
  </ng-template>
  <input
    pInputText
    type="text"
    [(ngModel)]="selAtt.bezeichnung"
    class="p-inputtext-lg"
    style="width: 100%"
  />
  <ng-template #footer>
    <button pButton (click)="editAttBez()" class="p-button-text"><i class="pi pi-save"></i> Speichern</button>
    <button pButton (click)="visible = false" class="p-button-text"><i class="pi pi-check"></i> Abbrechen</button>
  </ng-template>
</p-dialog>
