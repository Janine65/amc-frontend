<div class="card">
  <p-toast key="local"></p-toast>
  <p-button
    pRipple
    type="button"
    icon="pi pi-plus"
    label="Neuen Eintrag hinzufügen"
    (click)="onAddNewRow()"
    severity="secondary"
    [outlined]="true"
    styleClass="mb-2"
  ></p-button>
  @if (!loading()) {
    <p-table [value]="parameters()" dataKey="id" editMode="row" showGridlines>
      <ng-template #header>
        <tr>
          <th style="width: 20%">Key</th>
          <th style="width: 70%">Value</th>
          <th style="width: 10%"></th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-parameter
        let-editing="editing"
        let-ri="rowIndex"
      >
        <tr
          [pEditableRow]="parameter"
          [pEditableRowDisabled]="parameter.id === 0"
        >
          <td [pEditableColumn]="parameter.key" pEditableColumnField="key">
            <p-cell-editor>
              <ng-template #input>
                <input
                  pInputText
                  type="text"
                  [style]="{ width: '100%' }"
                  [(ngModel)]="parameter.key"
                  required
                />
              </ng-template>
              <ng-template #output>
                {{ parameter.key }}
              </ng-template>
            </p-cell-editor>
          </td>
          <td [pEditableColumn]="parameter.value" pEditableColumnField="value">
            <p-cell-editor>
              <ng-template #input>
                <textarea
                  pTextarea
                  [autoResize]="true"
                  [(ngModel)]="parameter.value"
                  required
                  [style]="{ width: '100%' }"
                ></textarea>
              </ng-template>
              <ng-template #output>
                {{ parameter.value }}
              </ng-template>
            </p-cell-editor>
          </td>
          <td>
            <div class="flex items-center justify-center gap-2">
              @if (!editing) {
                <p-button
                  pRipple
                  type="button"
                  pInitEditableRow
                  icon="pi pi-pencil"
                  (click)="onRowEditInit(parameter)"
                  [rounded]="true"
                  [text]="true"
                ></p-button>
              }
              @if (!editing) {
                <p-button
                  pRipple
                  type="button"
                  icon="pi pi-trash"
                  (click)="onRowDelete(parameter, ri)"
                  [rounded]="true"
                  [text]="true"
                ></p-button>
              }
              @if (editing) {
                <p-button
                  pRipple
                  type="button"
                  pSaveEditableRow
                  icon="pi pi-check"
                  (click)="onRowEditSave(parameter, ri)"
                  [rounded]="true"
                  [text]="true"
                  severity="success"
                  styleClass="mr-2"
                ></p-button>
              }
              @if (editing) {
                <p-button
                  pRipple
                  type="button"
                  pCancelEditableRow
                  icon="pi pi-times"
                  (click)="onRowEditCancel(parameter, ri)"
                  [rounded]="true"
                  [text]="true"
                  severity="danger"
                ></p-button>
              }
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
