<p-scrollarea style="width: 100%; height: 80%">
  <p-scrollarea-viewport>
    <p-scrollarea-content>
  <form #f="ngForm" autocomplete="off" (ngSubmit)="save(f)">
    <div class="card">
      <div class="flex flex-wrap">
        <div class="mb-4 w-full md:w-1/2 mt-4">
          <label for="datum" class="mr-2">Datum</label>
          <p-datepicker
            dateFormat="dd.mm.yy"
            id="datum"
            name="datum"
            [required]="true"
            class="p-2 appearance-none outline-none w-full"
            appendTo="body"
            [(ngModel)]="anlass.datum_date"
            (onSelect)="getAnlaesse()"
          ></p-datepicker>
        </div>
        <div class="mb-4 w-full md:w-1/2">
          <label for="status">Status</label>
          <p-select-button
            [options]="lstStatus()"
            [(ngModel)]="anlass.status"
            optionLabel="name"
            optionValue="code"
            name="status"
            id="status"
            #status="ngModel"
            required
            class="p-2 appearance-none outline-none w-full"
          ></p-select-button>
        </div>
        <div class="mb-4 w-full">
          <label for="bezeichnung">Bezeichnung</label>
          <input
            type="text"
            id="bezeichnung"
            pInputText
            name="bezeichnung"
            #bezeichnung="ngModel"
            minlength="3"
            required
            class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
            [(ngModel)]="anlass.name"
          />
        </div>
        <div class="mb-4 w-full">
          <label for="beschreibung">Beschreibung</label>
          <textarea
            [(ngModel)]="anlass.beschreibung"
            id="beschreibung"
            [rows]="5"
            name="beschreibung"
            class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
          ></textarea>
        </div>
        <div class="flex items-center flex-wrap mb-4 w-full">
          <div class="flex items-center gap-2 mb-2">
            <input
              type="checkbox"
              id="kegeln"
              [(ngModel)]="anlass.istkegeln"
              name="kegeln"
            />
            <label for="kegeln">Kegeln?</label>
          </div>
          <div class="flex items-center gap-2 mb-2">
            <input
              type="checkbox"
              id="nachkegeln"
              [(ngModel)]="anlass.nachkegeln"
              name="nachkegeln"
            />
            <label for="nachkegeln">Nachkegeln?</label>
          </div>
          <div class="flex items-center gap-2 mb-2">
            <input
              type="checkbox"
              id="sam"
              [(ngModel)]="anlass.istsamanlass"
              name="vorstand"
            />
            <label for="sam">SAM-Anlass?</label>
          </div>
        </div>
        <div class="mb-4 w-full md:w-1/2">
          <label for="punkte">Punkte</label>
          <p-input-number
            inputId="integeronly"
            [max]="200"
            id="punkte"
            [(ngModel)]="anlass.punkte"
            name="punkte"
            class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
          ></p-input-number>
        </div>
        <div class="mb-4 w-full md:w-1/2">
          <label for="gaeste">Gäste</label>
          <p-input-number
            inputId="integeronly"
            id="gaeste"
            [(ngModel)]="anlass.gaeste"
            name="gaeste"
            class="text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
          ></p-input-number>
        </div>
        <div class="mb-4 w-full">
          <label for="vorjahr" class="mr-2">Vorjahres Anlass</label>
          <p-select
            id="vorjahr"
            [options]="dlstFKAnlaesse()"
            optionLabel="value"
            optionValue="id"
            [filter]="true"
            filterBy="value"
            [showClear]="true"
            name="vorjahr"
            class="mr-2 text-base text-color surface-overlay p-2 appearance-none outline-none w-full"
            [(ngModel)]="anlass.anlaesseid"
            [style]="{ width: '80%' }"
            appendTo="body"
            (onClear)="anlass.vorjahr = null"
          ></p-select>
        </div>
      </div>
    </div>
  </form>
    </p-scrollarea-content>
  </p-scrollarea-viewport>
  <p-scrollarea-scrollbar orientation="vertical">
    <p-scrollarea-handle />
  </p-scrollarea-scrollbar>
</p-scrollarea>
<p-toolbar>
  <button pButton type="button" severity="secondary" [outlined]="true" (click)="back()"><i class="pi pi-back"></i> Zurück</button>
  <button pButton type="button" severity="primary" [outlined]="true" (click)="save(f)"><i class="pi pi-save"></i> Sichern</button>
</p-toolbar>
